[project]
name = "agentic-rag-service"
version = "0.1.0"
description = "Intelligent RAG service combining semantic search, code execution, and agentic routing"
requires-python = ">=3.10"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Data Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",

    # Async Operations
    "aiofiles>=24.1.0",
    "aiosqlite>=0.21.0",

    # Vector Database
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.5",

    # Embeddings & LangChain
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-aws>=0.2.0",
    "langchain-postgres>=0.0.12",

    # DSPy Framework
    "dspy-ai>=2.5.0",

    # AWS Bedrock
    "boto3>=1.35.0",
    "botocore>=1.35.0",

    # Document Processing
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "python-magic>=0.4.27",
    "chardet>=5.2.0",

    # Text Processing
    "unstructured>=0.16.0",
    "markdown>=3.7",

    # Security & Auth
    "pyjwt>=2.9.0",
    "python-dotenv>=1.0.0",

    # Logging
    "loguru>=0.7.3",

    # Utilities
    "nanoid>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "black>=24.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
